name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Test proximity, unlock and login migration
      run: swift test
    - name: Test release script
      run: python3 -B -m unittest discover -s Tests -p 'test_*.py'
    - name: Build Debug and Release
      run: |
        xcodebuild build -project BLEUnlock.xcodeproj -scheme BLEUnlock -configuration Debug CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
        xcodebuild build -project BLEUnlock.xcodeproj -scheme BLEUnlock -configuration Release CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
        git diff --exit-code
